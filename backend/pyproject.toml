[project]
name = "prism-backend"
version = "0.1.0"
description = "PRISM — universal AI data intelligence and automation platform (API, worker, engine)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "openpyxl>=3.1",
  "xlsxwriter>=3.2",
  "xlrd>=2.0",
  "pdfplumber>=0.11",
  "chardet>=5",
  "python-dateutil>=2.9",
  "anthropic>=2.12",
  "pyjwt>=2.8",
  "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "formulas>=1.2", "fpdf2>=2.7", "xlwt>=1.3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running benchmarks (100k rows)"]
filterwarnings = ["ignore::UserWarning:openpyxl", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"
